<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8855a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9a7550;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- En alttaki kutu (en büyük) -->
  <rect x="20" y="70" width="50" height="30" rx="4" fill="url(#boxGrad1)" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="22" y="72" width="46" height="26" rx="2" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Ortadaki kutu (orta boy) -->
  <rect x="30" y="50" width="40" height="25" rx="4" fill="url(#boxGrad2)" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="32" y="52" width="36" height="21" rx="2" fill="rgba(255,255,255,0.15)"/>
  
  <!-- En üstteki kutu (en küçük) -->
  <rect x="40" y="35" width="30" height="20" rx="4" fill="url(#boxGrad3)" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="42" y="37" width="26" height="16" rx="2" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Sevimli yüz (opsiyonel, minimal) -->
  <circle cx="55" cy="45" r="2.5" fill="#2c2420" opacity="0.6"/>
  <path d="M 50 48 Q 55 50 60 48" stroke="#2c2420" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
